[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ol-core"
version = "0.1.0"
description = "Lógica compartilhada do PainelOL — integração Hypera"
requires-python = ">=3.11"
dependencies = [
    "pymysql>=1.1.2",
    "sqlalchemy>=2.0.0",
    "pyodbc>=5.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ol_core*"]
